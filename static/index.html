<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Directory & Analytics</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เชื่อมต่อไฟล์ CSS แยก -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 Classroom Directory
            </h1>
            <div id="auth-status" class="flex gap-3 items-center">
                <span id="user-display" class="hidden text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
                <button id="login-btn" onclick="openLoginModal()" class="bg-white text-indigo-600 px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-slate-100 transition">เข้าสู่ระบบ</button>
                <button id="logout-btn" onclick="logout()" class="hidden bg-red-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-600 transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6 space-y-6">

        <!-- Banner / Status -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">สมาชิกทั้งหมด</p>
                <h3 id="total-users" class="text-3xl font-bold text-indigo-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">ทักษะรวมในระบบ</p>
                <h3 id="total-skills" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">สถานะระบบ API</p>
                <h3 class="text-xl font-semibold text-emerald-500 mt-2 flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span> Online
                </h3>
            </div>
        </div>

        <!-- Add Skill Section -->
        <section id="my-skill-section" class="hidden bg-indigo-50 border border-indigo-200 p-5 rounded-xl space-y-3">
            <h3 class="font-bold text-indigo-900 text-md">➕ เพิ่มทักษะใหม่ของคุณ</h3>
            <form onsubmit="handleAddSkill(event)" class="flex gap-2">
                <input type="text" id="new-skill-input" placeholder="กรอกชื่อทักษะ เช่น FastAPI, Python..." required class="flex-1 border border-indigo-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">บันทึกทักษะ</button>
            </form>
        </section>

        <!-- Search Bar Section -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input type="text" id="search-skill-input" placeholder="🔍 ค้นหาเพื่อนตามทักษะ (เช่น FastAPI, SQLite...)" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="handleSearch()" class="bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition">ค้นหา</button>
            <button onclick="resetSearch()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-slate-300 transition">ล้าง</button>
        </section>

        <!-- Directory Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">รายชื่อนักเรียนและทักษะ</h2>
                <button onclick="fetchUsers()" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold">🔄 รีเฟรชข้อมูล</button>
            </div>

            <!-- User Cards Grid -->
            <div id="users-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-400 text-sm col-span-full text-center py-8">กำลังโหลดข้อมูล...</p>
            </div>
        </section>

    </main>

    <!-- Modal เข้าสู่ระบบ -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl">
            <h3 class="text-xl font-bold text-slate-800">เข้าสู่ระบบ</h3>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600">Username</label>
                    <input type="text" id="username" required class="w-full border border-slate-300 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">Password</label>
                    <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">Username หรือ Password ไม่ถูกต้อง</div>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-sm">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">เข้าสู่ระบบ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- เชื่อมต่อไฟล์ JavaScript แยก -->
    <script src="script.js"></script>
</body>
</html>
