<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Directory & Analytics</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เชื่อมต่อไฟล์ CSS แยก -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 Classroom Directory
            </h1>
            <div id="auth-status" class="flex gap-3 items-center">
                <span id="user-display" class="hidden text-sm bg-indigo-700 px-3 py-1 rounded-lg"></span>
                <div id="auth-btn">
                    <!-- ปุ่มเข้าสู่ระบบจะถูกควบคุมผ่าน JavaScript -->
                    <button onclick="openLoginModal()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-indigo-50 transition">
                        เข้าสู่ระบบ
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto p-6 space-y-6">
        
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">สมาชิกทั้งหมดในระบบ</p>
                    <h3 id="total-users" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-3 rounded-lg">👥</div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-medium">ทักษะที่มีทั้งหมด</p>
                    <h3 id="total-skills" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg">💡</div>
            </div>
        </div>

        <!-- Directory Section -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-800">รายชื่อสมาชิกและทักษะ</h2>
            </div>
            <!-- Users Grid -->
            <div id="users-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <p class="text-slate-400 text-sm col-span-full text-center py-6">กำลังโหลดข้อมูล...</p>
            </div>
        </section>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 relative">
            <h3 class="text-lg font-bold text-slate-800 mb-4">เข้าสู่ระบบ</h3>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                    <input type="text" id="username" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน (Password)</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <p id="login-error" class="hidden text-red-500 text-xs font-medium">ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง</p>
                
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition">เข้าสู่ระบบ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- เชื่อมต่อไฟล์ JavaScript แยก -->
    <script src="/static/script.js"></script>
</body>
</html>
