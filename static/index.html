<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Directory & Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🎓 Classroom Directory
            </h1>
            <div id="auth-status" class="flex gap-3 items-center">
                <span id="user-display" class="hidden text-sm bg-indigo-700 px-3 py-1 rounded-full"></span>
                <button id="login-btn" onclick="openLoginModal()" class="bg-white text-indigo-600 px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-slate-100 transition">เข้าสู่ระบบ</button>
                <button id="logout-btn" onclick="logout()" class="hidden bg-red-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-red-600 transition">ออกจากระบบ</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-6 space-y-6">

        <!-- Banner / Status -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">สมาชิกทั้งหมด</p>
                <h3 id="total-users" class="text-3xl font-bold text-indigo-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">ทักษะรวมในระบบ</p>
                <h3 id="total-skills" class="text-3xl font-bold text-emerald-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <p class="text-slate-500 text-sm">สถานะระบบ API</p>
                <h3 class="text-xl font-semibold text-emerald-500 mt-2 flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span> Online
                </h3>
            </div>
        </div>

        <!-- Add Skill Section (แสดงเฉพาะเมื่อล็อกอิน) -->
        <section id="my-skill-section" class="hidden bg-indigo-50 border border-indigo-200 p-5 rounded-xl space-y-3">
            <h3 class="font-bold text-indigo-900 text-md">➕ เพิ่มทักษะใหม่ของคุณ</h3>
            <form onsubmit="handleAddSkill(event)" class="flex gap-2">
                <input type="text" id="new-skill-input" placeholder="กรอกชื่อทักษะ เช่น FastAPI, Python..." required class="flex-1 border border-indigo-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">บันทึกทักษะ</button>
            </form>
        </section>

        <!-- Search Bar Section -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex gap-2">
            <input type="text" id="search-skill-input" placeholder="🔍 ค้นหาเพื่อนตามทักษะ (เช่น FastAPI, SQLite...)" class="flex-1 border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="handleSearch()" class="bg-slate-800 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition">ค้นหา</button>
            <button onclick="resetSearch()" class="bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-slate-300 transition">ล้าง</button>
        </section>

        <!-- Directory Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">รายชื่อนักเรียนและทักษะ</h2>
                <button onclick="fetchUsers()" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold">🔄 รีเฟรชข้อมูล</button>
            </div>

            <!-- User Cards Grid -->
            <div id="users-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-400 text-sm col-span-full text-center py-8">กำลังโหลดข้อมูล...</p>
            </div>
        </section>

    </main>

    <!-- Modal เข้าสู่ระบบ -->
    <div id="login-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-4 shadow-xl">
            <h3 class="text-xl font-bold text-slate-800">เข้าสู่ระบบ</h3>
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-600">Username</label>
                    <input type="text" id="username" required class="w-full border border-slate-300 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600">Password</label>
                    <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg p-2.5 mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">Username หรือ Password ไม่ถูกต้อง</div>
                <div class="flex gap-2 justify-end pt-2">
                    <button type="button" onclick="closeLoginModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-sm">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">เข้าสู่ระบบ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = "http://127.0.0.1:8000";
        let currentUserId = null;

        document.addEventListener("DOMContentLoaded", () => {
            checkAuth();
            fetchUsers();
            fetchAnalytics();
        });

        // ดึงข้อมูลสมาชิกทั้งหมด
        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/users`);
                const users = await res.json();
                document.getElementById("total-users").textContent = users.length;
                renderUserCards(users);
            } catch (err) {
                console.error("Error fetching users:", err);
            }
        }

        // แสดงผล User Cards
        function renderUserCards(users) {
            const grid = document.getElementById("users-grid");
            const currentUsername = localStorage.getItem("username");

            if (users.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 text-sm col-span-full text-center py-8">ไม่พบข้อมูลสมาชิก</p>`;
                return;
            }

            grid.innerHTML = users.map(user => {
                const isMe = user.username === currentUsername;
                return `
                    <div class="border ${isMe ? 'border-indigo-400 bg-indigo-50/20' : 'border-slate-200'} rounded-lg p-4 space-y-2 hover:border-indigo-300 transition relative">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-slate-800">${user.username} ${isMe ? '<span class="text-xs text-indigo-600 font-normal">(คุณ)</span>' : ''}</h4>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${user.role}</span>
                        </div>
                        <p class="text-sm text-slate-500">${user.bio || 'ไม่มีคำอธิบายตัวตน'}</p>
                        <div class="pt-2 flex flex-wrap gap-1">
                            ${user.skills.length > 0 
                                ? user.skills.map(s => `
                                    <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 text-xs px-2 py-1 rounded-md font-medium flex items-center gap-1">
                                        # ${s.skill_name}${isMe ? `<button onclick="deleteSkill(${s.id})" class="text-red-400 hover:text-red-600 ml-1 font-bold">×</button>` : ''}
                                    </span>
                                `).join('') 
                                : '<span class="text-xs text-slate-400">ยังไม่มีทักษะที่บันทึก</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // เพิ่มทักษะใหม่
        async function handleAddSkill(e) {
            e.preventDefault();
            const skillName = document.getElementById("new-skill-input").value;
            const token = localStorage.getItem("access_token");

            try {
                const res = await fetch(`${API_URL}/users/me/skills`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ skill_name: skillName })
                });

                if (res.ok) {
                    document.getElementById("new-skill-input").value = "";
                    fetchUsers();
                    fetchAnalytics();
                } else {
                    alert("ไม่สามารถเพิ่มทักษะได้");
                }
            } catch (err) {
                console.error("Error adding skill:", err);
            }
        }

        // ลบทักษะ
        async function deleteSkill(skillId) {
            if (!confirm("คุณต้องการลบทักษะนี้ใช่หรือไม่?")) return;
            const token = localStorage.getItem("access_token");

            try {
                const res = await fetch(`${API_URL}/skills/${skillId}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (res.ok) {
                    fetchUsers();
                    fetchAnalytics();
                } else {
                    alert("ไม่สามารถลบทักษะได้");
                }
            } catch (err) {
                console.error("Error deleting skill:", err);
            }
        }

        // ค้นหาทักษะ
        async function handleSearch() {
            const query = document.getElementById("search-skill-input").value.trim();
            if (!query) return fetchUsers();

            try {
                const res = await fetch(`${API_URL}/skills/search?skill_name=${encodeURIComponent(query)}`);
                const users = await res.json();
                renderUserCards(users);
            } catch (err) {
                console.error("Error searching:", err);
            }
        }

        function resetSearch() {
            document.getElementById("search-skill-input").value = "";
            fetchUsers();
        }

        // ดึงข้อมูล Analytics
        async function fetchAnalytics() {
            try {
                const res = await fetch(`${API_URL}/analytics/skills`);
                const data = await res.json();
                document.getElementById("total-skills").textContent = data.total_skills_count || 0;
            } catch (err) {
                console.error("Error fetching analytics:", err);
            }
        }

        // จัดการระบบ Auth (Login / Logout)
        function checkAuth() {
            const token = localStorage.getItem("access_token");
            const username = localStorage.getItem("username");
            if (token && username) {
                document.getElementById("login-btn").classList.add("hidden");
                document.getElementById("logout-btn").classList.remove("hidden");
                document.getElementById("my-skill-section").classList.remove("hidden");
                const userDisplay = document.getElementById("user-display");
                userDisplay.textContent = `👤 ${username}`;
                userDisplay.classList.remove("hidden");
            } else {
                document.getElementById("my-skill-section").classList.add("hidden");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            const formData = new URLSearchParams();
            formData.append("username", usernameInput);
            formData.append("password", passwordInput);

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem("access_token", data.access_token);
                    localStorage.setItem("username", usernameInput);
                    closeLoginModal();
                    checkAuth();
                    fetchUsers();
                } else {
                    document.getElementById("login-error").classList.remove("hidden");
                }
            } catch (err) {
                console.error("Login failed:", err);
            }
        }

        function logout() {
            localStorage.removeItem("access_token");
            localStorage.removeItem("username");
            location.reload();
        }

        function openLoginModal() {
            document.getElementById("login-modal").classList.remove("hidden");
        }
        function closeLoginModal() {
            document.getElementById("login-modal").classList.add("hidden");
            document.getElementById("login-error").classList.add("hidden");
        }
    </script>
</body>
</html>
